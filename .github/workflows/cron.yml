name: Run Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
env:
  APP_WEBHOOK_ID: "${{ secrets.APP_WEBHOOK_ID }}"
  APP_WEBHOOK_TOKEN: "${{ secrets.APP_WEBHOOK_TOKEN }}"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install
      - run: bun run index.ts
